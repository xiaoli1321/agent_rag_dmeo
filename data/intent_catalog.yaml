slots:
  target_product:
    entity_field: product
    question: "请问你咨询的是哪款产品或设备型号？（我们主要有 GS1、ECO、GS3）"
    options: ["GS1", "ECO", "GS3"]
    reason: missing_target
  reference_target:
    entity_field: product
    question: "你说的“这个”具体是哪款产品或型号？（我们主要有 GS1、ECO、GS3）"
    options: ["GS1", "ECO", "GS3"]
    reason: ambiguous_reference
  problem_detail:
    entity_field: issue
    question: "{product}具体出现了什么问题或表现？"
    options: ["无法连接", "读数异常", "传感器脱落", "其他问题"]
    reason: missing_detail
    vague_values: ["坏了", "不行", "有问题", "用不了", "不能用", "难用", "不好用", "太难用", "难用死了"]
  user_goal:
    entity_field: requested_action
    question: "你希望查询产品信息、排查使用问题，还是办理售后？"
    options: ["查询产品信息", "排查使用问题", "办理售后", "不清楚"]
    reason: missing_goal

intents:
  产品咨询:
    description: 询问 CGM 功能、规格、兼容性、防水、佩戴、校准或读数原理等知识。
    examples: ["CGM 是什么？", "GS3 防水吗？"]
    handler: product_consultant
    required_slots: [target_product]
    clarification_order: [target_product]
    direct_handoff: false
    default_actionability: ready
  使用问题:
    description: 已在使用设备，遇到连接、佩戴、读数、告警或传感器问题。
    examples: ["GS3 连不上手机", "传感器脱落了"]
    handler: product_consultant
    required_slots: [target_product, problem_detail]
    clarification_order: [target_product, problem_detail]
    direct_handoff: false
    default_actionability: ready
  售后诉求:
    description: 订单、物流、退款、换货、补发、保修、投诉或人工服务。
    examples: ["我要退款", "订单什么时候发货？"]
    handler: after_sales
    required_slots: []
    clarification_order: []
    direct_handoff: true
    default_actionability: ready
  闲聊:
    description: 问候或与 CGM 客服无关的内容。
    examples: ["你好", "今天天气怎么样？"]
    handler: smalltalk
    required_slots: []
    clarification_order: []
    direct_handoff: false
    default_actionability: unsupported

# ── 关键词列表（用于启发式兜底分类，无 LLM 时使用）──
keywords:
  # 意图分类信号（消息中出现任一关键词即触发对应意图候选）
  intent_signals:
    产品咨询:
      - 防水
      - 游泳
      - 洗澡
      - cgm
      - 传感器
      - 硅基
      - 血糖
      - gs1
      - gs3
      - eco
      - metatwin
      - ks3
      - 手表
      - 健康app
    使用问题:
      - 怎么用
      - 使用
      - 连不上
      - 连接不上
      - 断连
      - 无法连接
      - 搜不到
      - 扫不上
      - 连接
      - 佩戴
      - 脱落
      - 读数
      - 数据不准
      - 不准
      - 告警
      - 校准
      - 坏了
    售后诉求:
      - 订单
      - 物流
      - 发货
      - 退款
      - 换货
      - 退货
      - 保修
      - 补发
      - 投诉
      - 赔偿
    闲聊:
      - 你好
      - 您好
      - 嗨
      - hello
      - 你是谁
      - 谢谢
      - 再见

  # 情绪信号
  emotion_signals:
    愤怒:
      - 太差
      - 垃圾
      - 气死
      - 再也不用
      - 无法接受
      - 必须马上
    不满:
      - 没有用
      - 不行
      - 怎么回事
      - 烦
      - 服了

  # 转人工标记
  handoff:
    - 人工
    - 客服
    - 坐席
    - 投诉
    - 退款
    - 赔偿
    - 换货
    - 退货

  # 模糊故障描述（不能仅据此判断为售后）
  vague_issue:
    - 坏了
    - 不行
    - 有问题
    - 用不了
    - 不能用
    - 难用
    - 不好用
    - 太难用
    - 难用死了

  # 修正标记（用户纠正上一轮澄清）
  correction:
    - 不是
    - 不对
    - 改成
    - 应该是

  # 负面情绪/排障失败反馈
  negative_feedback:
    - 烂产品
    - 服了
    - 还是不行
    - 垃圾
    - 太差

  # 新话题切换标记（跳过当前澄清）
  new_topic_switch:
    - 天气
    - 新闻
    - 股票
    - 写代码
    - 讲故事
    - 写一首诗

  # 医疗紧急/诊疗表达（域外处理）
  medical_out_of_scope:
    - 低血糖昏迷
    - 昏迷
    - 出血
    - 严重过敏
    - 呼吸困难
    - 急救

  # 排障反馈标记（用户反馈已尝试排障建议但仍未解决）
  troubleshooting_feedback:
    - 还是不行
    - 按照你的操作
    - 按你的操作
    - 按你的方法
    - 跟着做了
    - 试了不行
    - 试过了不行
    - 没有用
    - 没效果
    - 没解决
    - 烂产品
    - 烂东西
    - 服了

  # 不确定回答
  unclear_answer:
    - 不知道
    - 不清楚
    - 都不是
    - 不确定
    - 没注意
